<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" width="760" height="750" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="750" fill="#f6f5f1"/>
  <text x="20" y="44" font-size="28" font-weight="700" fill="#1c1b18">EtherLottery</text>
  <text x="20" y="70" font-size="14" fill="#6b6a63">Ten coupons at 0.001 ETH. Chainlink VRF picks one winner who takes 0.009 ETH. The protocol keeps a 10% fee.</text>

  <!-- mode card -->
  <rect x="20" y="86" width="720" height="64" rx="14" fill="#fff" stroke="#e3e1d8"/>
  <rect x="38" y="102" width="170" height="32" rx="10" fill="#fff" stroke="#e3e1d8"/>
  <rect x="38" y="102" width="85" height="32" rx="10" fill="#b7791f"/>
  <text x="80.5" y="123" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Demo</text>
  <text x="165.5" y="123" font-size="14" fill="#1c1b18" text-anchor="middle">Live</text>
  <text x="224" y="123" font-size="13" fill="#6b6a63">Simulated chain, no wallet needed.</text>

  <!-- main card -->
  <rect x="20" y="166" width="720" height="450" rx="14" fill="#fff" stroke="#e3e1d8"/>
  <text x="38" y="204" font-size="18" font-weight="700" fill="#1c1b18">Round 0</text>
  <rect x="646" y="186" width="76" height="26" rx="13" fill="none" stroke="#2f855a"/>
  <text x="684" y="204" font-size="13" font-weight="700" fill="#2f855a" text-anchor="middle">Open</text>

  <!-- stats -->
  <g font-size="12" fill="#6b6a63">
    <rect x="38" y="226" width="163" height="54" rx="10" fill="#f0eee6"/><text x="48" y="246">Coupon price</text>
    <rect x="211" y="226" width="163" height="54" rx="10" fill="#f0eee6"/><text x="221" y="246">Prize (after 10% fee)</text>
    <rect x="384" y="226" width="163" height="54" rx="10" fill="#f0eee6"/><text x="394" y="246">Sold</text>
    <rect x="557" y="226" width="165" height="54" rx="10" fill="#f0eee6"/><text x="567" y="246">Sales close in</text>
  </g>
  <g font-size="16" font-weight="700" fill="#1c1b18">
    <text x="48" y="269">0.001 ETH</text><text x="221" y="269">0.009 ETH</text>
    <text x="394" y="269">4 / 10</text><text x="567" y="269">21d 23h 59m</text>
  </g>

  <!-- progress -->
  <rect x="38" y="298" width="684" height="8" rx="4" fill="#f0eee6"/>
  <rect x="38" y="298" width="274" height="8" rx="4" fill="#b7791f"/>

  <!-- coupon grid -->
  <g font-size="11">
    <!-- row 1 -->
    <rect x="39" y="322" width="130" height="70" rx="12" fill="#f0eee6" stroke="#b7791f" stroke-width="2"/>
    <text x="104" y="352" font-size="18" font-weight="700" fill="#1c1b18" text-anchor="middle">1</text>
    <text x="104" y="372" fill="#1c1b18" text-anchor="middle">0x7a3…f2c</text>

    <rect x="177" y="322" width="130" height="70" rx="12" fill="#f0eee6" stroke="#b7791f" stroke-width="2"/>
    <text x="242" y="352" font-size="18" font-weight="700" fill="#1c1b18" text-anchor="middle">2</text>
    <text x="242" y="372" fill="#1c1b18" text-anchor="middle">0x19e…8b0</text>

    <rect x="315" y="322" width="130" height="70" rx="12" fill="#b7791f" stroke="#b7791f" stroke-width="2"/>
    <text x="380" y="352" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="380" y="372" fill="#fff" text-anchor="middle">0xYou…mo1 (you)</text>

    <rect x="453" y="322" width="130" height="70" rx="12" fill="#f0eee6" stroke="#b7791f" stroke-width="2"/>
    <text x="518" y="352" font-size="18" font-weight="700" fill="#1c1b18" text-anchor="middle">4</text>
    <text x="518" y="372" fill="#1c1b18" text-anchor="middle">0xc40…d71</text>

    <rect x="591" y="322" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="656" y="363" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">5</text>

    <!-- row 2 -->
    <rect x="39" y="400" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="104" y="441" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">6</text>
    <rect x="177" y="400" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="242" y="441" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">7</text>
    <rect x="315" y="400" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="380" y="441" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">8</text>
    <rect x="453" y="400" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="518" y="441" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">9</text>
    <rect x="591" y="400" width="130" height="70" rx="12" fill="none" stroke="#e3e1d8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="656" y="441" font-size="18" font-weight="700" fill="#6b6a63" text-anchor="middle">10</text>
  </g>

  <!-- action -->
  <rect x="38" y="488" width="220" height="40" rx="10" fill="#b7791f"/>
  <text x="148" y="513" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Buy coupon · 0.001 ETH</text>

  <!-- demo tools -->
  <line x1="38" y1="548" x2="722" y2="548" stroke="#e3e1d8" stroke-dasharray="5 4"/>
  <text x="38" y="570" font-size="12" fill="#6b6a63">Demo controls (simulate what the chain and Chainlink would do)</text>
  <g font-size="14" fill="#1c1b18" text-anchor="middle">
    <rect x="38" y="580" width="140" height="28" rx="10" fill="#fff" stroke="#e3e1d8"/><text x="108" y="599">+ Random buyer</text>
    <rect x="188" y="580" width="120" height="28" rx="10" fill="#fff" stroke="#e3e1d8" opacity=".5"/><text x="248" y="599" opacity=".5">Fulfill VRF</text>
    <rect x="318" y="580" width="130" height="28" rx="10" fill="#fff" stroke="#e3e1d8"/><text x="383" y="599">Skip 22 days</text>
  </g>

  <!-- activity -->
  <rect x="20" y="632" width="720" height="100" rx="14" fill="#fff" stroke="#e3e1d8"/>
  <text x="38" y="660" font-size="16" font-weight="700" fill="#1c1b18">Activity</text>
  <g font-size="13" fill="#1c1b18">
    <text x="38" y="684"><tspan fill="#6b6a63" font-family="ui-monospace,Menlo,monospace" font-size="12">10:42:07</tspan>  Bought a coupon</text>
    <text x="38" y="706"><tspan fill="#6b6a63" font-family="ui-monospace,Menlo,monospace" font-size="12">10:41:55</tspan>  A random buyer joined</text>
    <text x="38" y="728" opacity=".0">.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
